<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonoaudio-Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#172237',
              850: '#0b111e',
              950: '#050811'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }

    /* Custom scrollbar for medical aesthetic */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Email content rendering */
    .email-content {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .email-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .email-content a {
      color: #2563eb;
      text-decoration: underline;
    }
    .dark .email-content a {
      color: #60a5fa;
    }
    .email-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    .email-content td, .email-content th {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .dark .email-content td, .dark .email-content th {
      border-color: #334155;
    }
    .email-content blockquote {
      border-left: 3px solid #cbd5e1;
      padding-left: 12px;
      margin: 12px 0;
      color: #64748b;
    }
    .dark .email-content blockquote {
      border-left-color: #475569;
      color: #94a3b8;
    }
    .email-content pre {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }
    .dark .email-content pre {
      background: #1e293b;
    }
    .email-content hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 16px 0;
    }
    .dark .email-content hr {
      border-top-color: #334155;
    }
    .email-content .gmail_quote {
      border-left: 2px solid #ccc;
      padding-left: 12px;
      margin: 12px 0;
      color: #666;
    }
    .dark .email-content .gmail_quote {
      border-left-color: #475569;
      color: #94a3b8;
    }
  </style>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FonoPro">
<link rel="apple-touch-icon" href="/logo192.png">

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
